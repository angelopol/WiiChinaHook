[project]
name = "wiichinahook"
version = "0.2.0"
description = "Wiimote clone DSU hook for Windows using a DolphinBar or PyUSB and Bumble."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bumble==0.0.235",
    "pyusb==1.3.1",
    "libusb1==3.4.0",
    "libusb-package==1.0.26.4",
    "websockets==17.2",
    "hidapi==0.15.0",
]

[project.scripts]
wiichinahook = "wiichinahook.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
